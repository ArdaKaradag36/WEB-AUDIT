name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  runner:
    name: Runner (Node + Playwright) – lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "runner/.nvmrc"
          cache: "npm"
          cache-dependency-path: "runner/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Upload test artifacts (runner)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-test-artifacts
          path: |
            test-results/**
            reports/runs/**
          if-no-files-found: ignore

  security-audit:
    name: Dependency Security Audit (report-only)
    runs-on: ubuntu-latest
    needs: [runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "runner/.nvmrc"
          cache: "npm"
          cache-dependency-path: "runner/package-lock.json"

      - name: Install runner dependencies
        working-directory: runner
        run: npm ci

      - name: Run npm audit (high and above, report-only)
        working-directory: runner
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Summarize security audit
        if: always()
        run: |
          {
            echo "## Dependency Security Audit (report-only)";
            echo "";
            echo "- Node: \`npm audit --audit-level=high\` has been executed for the runner.";
            echo "";
            echo "> CI currently does **not** fail on these checks by default. Failing policy can be enabled later";
            echo "> based on severity/age thresholds defined in security governance.";
          } >> "$GITHUB_STEP_SUMMARY"

